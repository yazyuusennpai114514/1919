<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>bughunter</title>
</head>
<body><div class="app" id="app">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --bg: #0F1521;
      --panel: #161D2B;
      --panel-raised: #1D2537;
      --border: #2A3349;
      --text: #E8EAF0;
      --text-muted: #8994AC;
      --accent: #E8A33D;
      --critical: #E5484D;
      --high: #F0883E;
      --medium: #E8C547;
      --low: #5B8DEF;
    }
    * { box-sizing: border-box; }
    .app {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100%;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.75rem; }
    .brand { background: none; border: none; display: flex; align-items: baseline; gap: 0.35rem; cursor: pointer; color: var(--text); font-family: 'IBM Plex Mono', monospace; }
    .brand-mark { color: var(--accent); font-size: 1.3rem; }
    .brand-text { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
    .brand-sub { color: var(--text-muted); font-weight: 400; }
    .tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .tab { background: none; border: 1px solid transparent; color: var(--text-muted); font-family: 'Noto Sans JP', sans-serif; font-size: 0.85rem; padding: 0.5rem 0.85rem; border-radius: 6px; cursor: pointer; transition: all 0.15s ease; }
    .tab:hover { color: var(--text); background: var(--panel-raised); }
    .tab.active { color: var(--bg); background: var(--accent); font-weight: 500; }
    .main { padding: 2rem 1.5rem 3rem; max-width: 960px; margin: 0 auto; }
    .loading { text-align: center; padding: 4rem 0; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
    .hero { display: flex; flex-direction: column; gap: 2.5rem; padding-top: 1rem; }
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.12em; color: var(--accent); margin: 0 0 0.75rem; }
    .hero-copy h1 { font-family: 'IBM Plex Mono', monospace; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.35; font-weight: 600; margin: 0 0 1rem; }
    .lead { color: var(--text-muted); font-size: 0.98rem; line-height: 1.8; max-width: 560px; margin: 0 0 1.5rem; }
    .hero-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn { font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 500; padding: 0.75rem 1.35rem; border-radius: 7px; border: 1px solid transparent; cursor: pointer; transition: transform 0.1s ease, opacity 0.15s ease; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.primary { background: var(--accent); color: #1A1204; }
    .btn.primary:hover:not(:disabled) { opacity: 0.9; }
    .btn.ghost { background: none; border-color: var(--border); color: var(--text); }
    .btn.ghost:hover { background: var(--panel-raised); }
    .btn.sm { padding: 0.5rem 0.9rem; font-size: 0.8rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .stat { background: var(--panel); padding: 1.4rem 1rem; display: flex; flex-direction: column; gap: 0.4rem; border: none; cursor: default; color: var(--text); text-align: left; font-family: inherit; width: 100%; }
    button.stat { cursor: pointer; }
    button.stat:hover { background: var(--panel-raised); }
    .stat-num { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); }
    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; margin: 0 0 0.5rem; }
    .legend-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .severity-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 0.32rem 0.65rem; border-radius: 999px; border: 1px solid var(--chip); color: var(--chip); background: color-mix(in srgb, var(--chip) 12%, transparent); }
    .severity-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--chip); display: inline-block; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; }
    .panel.narrow { max-width: 620px; margin: 0 auto; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .panel-head h2, .panel-head h3 { margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
    .empty-state { padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 10px; }
    .muted { color: var(--text-muted); font-size: 0.88rem; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .card { text-align: left; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; cursor: pointer; color: var(--text); font-family: inherit; display: flex; flex-direction: column; gap: 0.6rem; transition: border-color 0.15s ease; width: 100%; }
    .card:hover { border-color: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .card-company { font-weight: 600; }
    .card-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-muted); }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
    .reward { color: var(--accent); }
    .back { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 0; margin-bottom: 1.25rem; font-family: 'Noto Sans JP', sans-serif; }
    .back:hover { color: var(--text); }
    .detail-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; }
    .detail-head h2 { margin: 0; font-family: 'IBM Plex Mono', monospace; }
    .detail-desc { color: var(--text-muted); line-height: 1.7; margin: 0.75rem 0 1.5rem; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem; padding: 1.25rem; background: var(--panel-raised); border-radius: 10px; border: 1px solid var(--border); }
    .detail-grid p:last-child { margin: 0; font-size: 0.9rem; white-space: pre-wrap; }
    .report-list { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .report-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0.9rem; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 8px; flex-wrap: wrap; }
    .report-title { flex: 1; font-size: 0.88rem; }
    .report-status { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-muted); }
    .form { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 1.25rem; }
    .report-form { margin: 1.25rem 0 2rem; padding: 1.25rem; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 10px; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-label { font-size: 0.82rem; font-weight: 500; color: var(--text); }
    .field-hint { font-size: 0.74rem; color: var(--text-muted); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    input, textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 0.65rem 0.8rem;
      color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; resize: vertical; width: 100%;
    }
    input:focus, textarea:focus, .btn:focus-visible, .tab:focus-visible, .card:focus-visible, .sev-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .severity-select { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .sev-btn { display: inline-flex; align-items: center; gap: 0.4rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; padding: 0.4rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; }
    .sev-btn i { width: 6px; height: 6px; border-radius: 50%; background: var(--chip); display: inline-block; }
    .sev-btn.active { border-color: var(--chip); color: var(--chip); background: color-mix(in srgb, var(--chip) 12%, transparent); }
    .form-error { color: var(--critical); font-size: 0.82rem; margin: 0; }
    .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--panel-raised); border: 1px solid var(--accent); color: var(--text); padding: 0.65rem 1.1rem; border-radius: 999px; font-size: 0.82rem; z-index: 50; font-family: 'IBM Plex Mono', monospace; display: none; }
    .avatar { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--bg); border: 1px solid var(--border); flex-shrink: 0; }
    .avatar-lg { width: 64px; height: 64px; border-radius: 10px; }
    .avatar-placeholder { display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); font-size: 0.9rem; }
    .avatar-picker { display: flex; align-items: center; gap: 0.9rem; }
    .avatar-picker input[type="file"] { width: auto; padding: 0.4rem 0; font-size: 0.8rem; color: var(--text-muted); }
    .foot { text-align: center; padding: 1.25rem; color: var(--text-muted); font-size: 0.72rem; border-top: 1px solid var(--border); }
    .auth-status { display: flex; align-items: center; gap: 0.6rem; font-size: 0.82rem; color: var(--text-muted); }
    .auth-status .who { font-family: 'IBM Plex Mono', monospace; color: var(--text); }
    .enroll-warning { background: color-mix(in srgb, var(--critical) 12%, transparent); border: 1px solid var(--critical); color: var(--text); padding: 0.9rem 1rem; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .qr-box { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1.5rem; background: var(--panel-raised); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1.5rem; }
    .qr-box canvas { border-radius: 8px; }
    .secret-text { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--text-muted); word-break: break-all; text-align: center; }
    .backup-codes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .backup-codes span { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--text); }
    .code-input { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; letter-spacing: 0.4em; text-align: center; }
    .login-type-toggle { display: flex; gap: 0.5rem; }
    .login-type-toggle button { flex: 1; }
    .report-row-clickable { cursor: pointer; transition: border-color 0.15s ease; }
    .report-row-clickable:hover { border-color: var(--accent); }
    .comment-thread { display: flex; flex-direction: column; gap: 0.75rem; margin: 1.25rem 0; }
    .comment-bubble { padding: 0.85rem 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-raised); max-width: 85%; }
    .comment-bubble.mine { align-self: flex-end; border-color: var(--accent); background: var(--accent-soft, rgba(232,163,61,0.1)); }
    .comment-meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    .comment-text { font-size: 0.88rem; line-height: 1.6; white-space: pre-wrap; }
    .comment-item { align-items: flex-start !important; flex-direction: column; gap: 0.35rem !important; }
    .comment-head { display: flex; justify-content: space-between; width: 100%; }
    .comment-message { margin: 0; font-size: 0.88rem; line-height: 1.6; white-space: pre-wrap; }
    @media (max-width: 560px) {
      .field-row { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr; }
      .main { padding: 1.5rem 1rem 2.5rem; }
    }
  </style>

  <header class="topbar">
    <button class="brand" data-tab="home">
      <span class="brand-mark">⌁</span>
      <span class="brand-text">bughunter<span class="brand-sub">.uk</span></span>
    </button>
    <nav class="tabs">
      <button class="tab" data-tab="home">概要</button>
      <button class="tab" data-tab="programs">プログラム一覧</button>
      <button class="tab guest-only" data-tab="company">企業として掲載</button>
      <button class="tab guest-only" data-tab="hunter">ハンター登録</button>
      <button class="tab guest-only" data-tab="login">ログイン</button>
      <button class="tab auth-only" data-tab="myprofile" style="display:none">マイページ</button>
      <button class="tab auth-only hunter-only" data-tab="myreports" style="display:none">マイレポート</button>
    </nav>
    <div class="auth-status" id="auth-status"></div>
  </header>

  <div class="toast" id="toast"></div>

  <main class="main" id="main">
    <div class="loading">読み込み中…</div>
  </main>

  <footer class="foot">
    このサイトは Cloudflare Workers + D1 上で動く本番APIに接続しています。
  </footer>
</div>

<script>
(function () {
  // ここを自分のWorkers URLに合わせて変更してください
  const API_BASE = "https://bbp.hosimatisutazio.workers.dev";

  const SEVERITIES = [
    { key: "critical", ja: "緊急", en: "Critical", color: "#E5484D" },
    { key: "high", ja: "高", en: "High", color: "#F0883E" },
    { key: "medium", ja: "中", en: "Medium", color: "#E8C547" },
    { key: "low", ja: "低", en: "Low", color: "#5B8DEF" },
  ];

  const state = { tab: "home", programs: [], hunters: [], reportCount: 0, activeProgramId: null, activeReportId: null, reportOrigin: null };

  const main = document.getElementById("main");
  const toastEl = document.getElementById("toast");
  let toastTimer = null;

  function sevMeta(key) { return SEVERITIES.find((s) => s.key === key) || SEVERITIES[2]; }
  function fmtDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }
  function esc(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 3200);
  }

  // ---------- API呼び出し ----------
  async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}`);
    if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
    return res.json();
  }
  async function apiPost(path, body) {
    const session = getSession();
    const res = await fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(session ? { Authorization: `Bearer ${session.token}` } : {}),
      },
      body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `POST ${path} failed: ${res.status}`);
    return json;
  }

  // 画像アップロード（multipart/form-data、本人のトークンが必要）
  async function apiUploadAvatar(type, id, file) {
    const fd = new FormData();
    fd.append("avatar", file);
    const session = getSession();
    const res = await fetch(`${API_BASE}/${type}/${id}/avatar`, {
      method: "POST",
      headers: session ? { Authorization: `Bearer ${session.token}` } : {},
      body: fd,
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || "画像のアップロードに失敗しました");
    return json;
  }

  // ---------- セッション（ローカルストレージ） ----------
  const SESSION_KEY = "bbp_session";
  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function setSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    renderAuthStatus();
  }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
    renderAuthStatus();
  }

  async function apiConfirmTotp(type, id, code) {
    return apiPost(`/${type}/${id}/confirm-totp`, { code });
  }
  async function apiLogin(userType, email, code) {
    return apiPost("/auth/login", { userType, email, code });
  }
  async function apiLogout() {
    const session = getSession();
    if (!session) return;
    try {
      await fetch(`${API_BASE}/auth/logout`, {
        method: "POST",
        headers: { Authorization: `Bearer ${session.token}` },
      });
    } catch (e) {
      // ネットワークエラーでもローカルのセッションは消す
    }
    clearSession();
  }

  function updateNavVisibility() {
    const session = getSession();
    document.querySelectorAll(".guest-only").forEach((el) => { el.style.display = session ? "none" : ""; });
    document.querySelectorAll(".auth-only").forEach((el) => { el.style.display = session ? "" : "none"; });
    document.querySelectorAll(".hunter-only").forEach((el) => {
      if (!session) { el.style.display = "none"; return; }
      el.style.display = session.userType === "hunter" ? "" : "none";
    });
  }

  function renderAuthStatus() {
    updateNavVisibility();
    const el = document.getElementById("auth-status");
    const session = getSession();
    if (!session) {
      el.innerHTML = "";
      return;
    }
    const label = session.userType === "hunter" ? "ハンター" : "企業";
    el.innerHTML = `
      <span class="who">${esc(session.name || "")}</span>
      <span class="muted">(${label})</span>
      <button class="btn ghost sm" id="logout-btn">ログアウト</button>
    `;
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await apiLogout();
      showToast("ログアウトしました");
      setTab("home");
    });
  }

  // D1のsnake_caseキーをフロント表示用に正規化
  function normalizeProgram(p) {
    return {
      id: p.id,
      companyName: p.company_name,
      contactEmail: p.contact_email,
      scope: p.scope,
      description: p.description,
      rewardMin: p.reward_min,
      rewardMax: p.reward_max,
      avatarUrl: p.avatar_key ? `${API_BASE}/avatars/${p.avatar_key}` : null,
      createdAt: p.created_at,
    };
  }
  function normalizeReport(r) {
    return {
      id: r.id,
      programId: r.program_id,
      title: r.title,
      severity: r.severity,
      description: r.description,
      poc: r.poc,
      contactEmail: r.contact_email,
      status: r.status,
      createdAt: r.created_at,
    };
  }

  async function refreshPrograms() {
    const data = await apiGet("/programs");
    state.programs = (data.programs || []).map(normalizeProgram);
  }
  async function refreshHunters() {
    const data = await apiGet("/hunters");
    state.hunters = data.hunters || [];
  }
  // 全プログラムのレポート件数を合計してホーム画面の統計に使う（MVP規模向けの簡易実装）
  async function refreshReportCount() {
    try {
      const counts = await Promise.all(
        state.programs.map((p) => apiGet(`/programs/${p.id}/reports`).then((d) => (d.reports || []).length).catch(() => 0))
      );
      state.reportCount = counts.reduce((a, b) => a + b, 0);
    } catch (e) {
      state.reportCount = 0;
    }
  }

  function setTab(tab) {
    const session = getSession();
    // ログイン中は登録・ログイン画面の代わりにプログラム一覧へ誘導
    if (session && (tab === "company" || tab === "hunter" || tab === "login")) {
      tab = "programs";
    }
    if (tab === "myreports" && (!session || session.userType !== "hunter")) {
      tab = session ? "myprofile" : "login";
    }
    state.tab = tab;
    state.activeProgramId = null;
    document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === tab));
    render();
  }

  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.addEventListener("click", () => setTab(el.dataset.tab));
  });

  // ---------- render ----------
  function render() {
    if (state.tab === "home") return renderHome();
    if (state.tab === "programs" && !state.activeProgramId) return renderProgramList();
    if (state.tab === "programs" && state.activeProgramId) return renderProgramDetail();
    if (state.tab === "company") return renderCompanyForm();
    if (state.tab === "hunter") return renderHunterForm();
    if (state.tab === "login") return renderLogin();
    if (state.tab === "myprofile") return renderMyProfile();
    if (state.tab === "myreports") return renderMyReports();
    if (state.tab === "reportdetail") return renderReportDetail();
  }

  function renderHome() {
    document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === "home"));
    main.innerHTML = `
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">JAPAN-FOCUSED BUG BOUNTY PLATFORM</p>
          <h1>脆弱性は、<br>見つけた人に還元する。</h1>
          <p class="lead">日本企業向けの、月額固定費ゼロで始められるバグバウンティ運用サイトです。企業はプログラムを掲載し、ハンターは登録して脆弱性を報告します。</p>
          <div class="hero-actions">
            <button class="btn primary" id="cta-company">企業として掲載する</button>

  // ---------- TOTP紐付け（QRコード表示 → 認証アプリでスキャン → 6桁コードで確認） ----------
  function renderTotpEnroll(userType, enrollData, avatarFile) {
    const typePath = userType === "hunter" ? "hunters" : "programs";
    document.querySelectorAll(".tab").forEach((el) => el.classList.remove("active"));

    main.innerHTML = `
      <section class="panel narrow">
        <h2>認証アプリを設定してください</h2>
        <div class="enroll-warning">
          この画面を閉じると、シークレットとバックアップコードは二度と表示されません。<br>
          必ず今のうちにスキャン・保存してください。
        </div>

        <div class="qr-box">
          <img id="qr-image" width="220" height="220" alt="QRコード" style="border-radius:8px; background:#fff; padding:8px;">
          <p class="secret-text">手動入力する場合のキー:<br>${esc(enrollData.secret)}</p>
        </div>

        <p class="section-label">バックアップコード（各1回のみ使用可）</p>
        <p class="muted">スマホを紛失した際、これらのコードでログインできます。安全な場所に保存してください。</p>
        <div class="backup-codes" id="backup-codes">
          ${enrollData.backupCodes.map((code) => `<span>${esc(code)}</span>`).join("")}
        </div>
        <button class="btn ghost sm" id="download-codes" type="button">バックアップコードをダウンロード</button>

        <form class="form" id="confirm-form" style="margin-top:1.75rem">
          <label class="field">
            <span class="field-label">認証アプリに表示されている6桁のコードを入力</span>
            <input class="code-input" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000">
          </label>
          <p class="form-error" id="confirm-error" style="display:none"></p>
          <button class="btn primary" type="submit">確認して完了する</button>
        </form>
      </section>
    `;

    // QRコードを画像APIで生成（外部JSライブラリ不要）
    const qrImg = document.getElementById("qr-image");
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(enrollData.otpauthUrl)}`;

    // バックアップコードのダウンロード
    document.getElementById("download-codes").addEventListener("click", () => {
      const text = `bughunter.uk バックアップコード\n\n${enrollData.backupCodes.join("\n")}\n\n各コードは1回だけ使用できます。大切に保管してください。`;
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "bughunter-backup-codes.txt";
      a.click();
      URL.revokeObjectURL(url);
    });

    // コード確認
    const confirmForm = document.getElementById("confirm-form");
    confirmForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = new FormData(confirmForm).get("code");
      const errEl = document.getElementById("confirm-error");
      const submitBtn = confirmForm.querySelector("button[type=submit]");
      submitBtn.disabled = true; submitBtn.textContent = "確認中…";
      try {
        const confirmResult = await apiConfirmTotp(typePath, enrollData.id, code);
        setSession({
          token: confirmResult.token,
          userType,
          id: enrollData.id,
          name: userType === "hunter" ? null : null,
        });
        // 名前が未取得なので/auth/meで補完
        try {
          const me = await apiGetAuthed("/auth/me");
          setSession({ token: confirmResult.token, userType, id: enrollData.id, name: userType === "hunter" ? me.handle : me.company_name });
        } catch (e) {}

        if (avatarFile && avatarFile.size > 0) {
          try {
            await apiUploadAvatar(typePath, enrollData.id, avatarFile);
          } catch (uploadErr) {
            showToast("登録は完了しましたが、画像のアップロードに失敗しました");
          }
        }

        await Promise.all([refreshPrograms(), refreshHunters()]);
        showToast("設定が完了しました。ログインしました");
        setTab("home");
      } catch (err) {
        submitBtn.disabled = false; submitBtn.textContent = "確認して完了する";
        errEl.textContent = err.message || "コードが正しくありません";
        errEl.style.display = "block";
      }
    });
  }

  async function apiGetAuthed(path) {
    const session = getSession();
    const res = await fetch(`${API_BASE}${path}`, {
      headers: session ? { Authorization: `Bearer ${session.token}` } : {},
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `GET ${path} failed`);
    return json;
  }

  async function apiPatch(path, body) {
    const session = getSession();
    const res = await fetch(`${API_BASE}${path}`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        ...(session ? { Authorization: `Bearer ${session.token}` } : {}),
      },
      body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `PATCH ${path} failed: ${res.status}`);
    return json;
  }

      return `
        <div class="enroll-warning" style="margin-top:0.75rem">
          VDPプログラムは現在<strong>一時停止中</strong>です（最終支払い: ${lastPaid}）。<br>

    return `<p class="muted" style="margin-top:0.5rem">プログラム種別: VDP（月額500円） ／ 最終支払い: ${lastPaid}</p>`;
  }

              <label class="field"><span class="field-label">報奨金 上限（円）</span><input type="number" min="0" name="rewardMax" value="${me.reward_max}"></label>
            </div>

      if (goReportsBtn) goReportsBtn.addEventListener("click", () => setTab("myreports"));
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      const errEl = document.getElementById("profile-error");
      const submitBtn = form.querySelector("button[type=submit]");

      if (isHunter && !data.handle) {
        errEl.textContent = "ハンドルネームは必須です";

  // ---------- マイレポート（自分が提出したレポート一覧） ----------

  // ---------- レポート詳細（本人ハンター or 宛先企業のみ。返信スレッド付き） ----------
  async function renderReportDetail() {
    const session = getSession();
    if (!session) { setTab("login"); return; }

    main.innerHTML = `<div class="loading">読み込み中…</div>`;
    let detail, comments, platformInfo;
    try {
      [detail, comments, platformInfo] = await Promise.all([
        apiGetAuthed(`/reports/${state.activeReportId}`),
        apiGetAuthed(`/reports/${state.activeReportId}/comments`),
        apiGet(`/platform-info`).catch(() => ({ paypalLink: null, feePercent: 10 })),
      ]);
    } catch (e) {
      showToast("レポートの取得に失敗しました");
      goBackFromReportDetail();
      return;
    }

    const r = detail.report;
    const sev = sevMeta(r.severity);
    const commentList = comments.comments || [];
    const isOwnerCompany = session.userType === "program" && session.id === detail.program.id;
    const isVdp = detail.program.program_type === "vdp";
    const STATUS_OPTIONS = ["トリアージ", "返信待ち", "info", "解決済み", "スパム", "N/A", "閉鎖"];

    main.innerHTML = `
      <section class="panel">
        <button class="back" id="report-back-btn">← 戻る</button>
        <div class="detail-head">
          <h2>${esc(r.title)}</h2>
          <span class="severity-chip" style="--chip:${sev.color}"><i></i> ${sev.ja}</span>
        </div>
        <p class="muted" style="margin:0.5rem 0 1.25rem">
          ${esc(detail.program.company_name)}宛${detail.hunter ? ` ／ 報告者: ${esc(detail.hunter.handle)}` : ""} ／ ステータス: ${esc(r.status)} ／ ${fmtDate(r.created_at)}
        </p>
        ${!isOwnerCompany && !isVdp && r.reward_amount != null ? `
          <p class="reward" style="font-family:'IBM Plex Mono',monospace; margin:0 0 1.25rem">
            報奨金: ¥${Number(r.reward_amount).toLocaleString()}（プラットフォーム手数料${platformInfo.feePercent}%差引後、¥${Math.round(Number(r.reward_amount) * (1 - platformInfo.feePercent / 100)).toLocaleString()} をお支払いします）${r.reward_paid ? "（支払い済み）" : "（未払い）"}
          </p>
        ` : ""}

        <div class="detail-grid" style="grid-template-columns:1fr">
          <div><p class="section-label">詳細な説明</p><p style="white-space:pre-wrap">${esc(r.description)}</p></div>
        </div>
        ${r.poc ? `
          <div class="detail-grid" style="grid-template-columns:1fr; margin-top:1rem">
            <div><p class="section-label">再現手順（PoC）</p><p style="white-space:pre-wrap">${esc(r.poc)}</p></div>
          </div>
        ` : ""}

        ${isOwnerCompany ? `
          <div class="report-form" style="margin-top:1.5rem">
            <p class="section-label" style="margin-bottom:0.75rem">管理（企業のみ）</p>
            ${!isVdp && r.reward_amount != null ? `
              <div class="detail-grid" style="grid-template-columns:1fr; margin-bottom:1rem">
                <div>
                  <p class="section-label">報奨金のお支払いについて</p>
                  <p style="line-height:1.8">
                    報奨金は<strong>プラットフォーム経由</strong>でハンターにお支払いします。以下の送金先に、報奨金の全額をお送りください（手数料${platformInfo.feePercent}%を差し引いた金額がハンターに届きます）。<br>
                    送金先(PayPal): <span style="font-family:'IBM Plex Mono',monospace">${esc(platformInfo.paypalLink || "未設定")}</span><br>
                    送金額（全額）: ¥${Number(r.reward_amount).toLocaleString()}<br>
                    プラットフォーム手数料（${platformInfo.feePercent}%）: ¥${Math.round(Number(r.reward_amount) * (platformInfo.feePercent / 100)).toLocaleString()}<br>
                    ハンターへの支払い額: ¥${Math.round(Number(r.reward_amount) * (1 - platformInfo.feePercent / 100)).toLocaleString()}

            <form class="form" id="status-form">

                <label class="field">

                ${!isVdp ? `
                  <label class="field">
                    <span class="field-label">報奨金（円）</span>

              <p class="form-error" id="status-error" style="display:none"></p>
              <button class="btn primary sm" type="submit">更新する</button>

          </div>
        ` : ""}

        <p class="section-label" style="margin-top:2rem">やり取り</p>
        <div class="comment-thread" id="comment-thread">
          ${commentList.length === 0
            ? `<p class="muted">まだやり取りはありません。</p>`
            : commentList.map((cm) => {
                const mine = cm.author_type === session.userType && cm.author_id === session.id;
                const who = cm.author_type === "hunter" ? "ハンター" : "企業";
                return `<div class="comment-bubble${mine ? " mine" : ""}">

      statusForm.addEventListener("submit", async (e) => {

        const status = fd.get("status");
        const hasRewardField = statusForm.querySelector("[name=rewardAmount]") !== null;
        const rewardRaw = fd.get("rewardAmount");
        const payload = { status };
        if (hasRewardField) {
          payload.rewardAmount = rewardRaw === "" ? null : Number(rewardRaw);
        }
        const errEl = document.getElementById("status-error");

          errEl.style.display = "block";
        }
      });

      document.getElementById("delete-report-btn").addEventListener("click", async () => {
        if (!confirm("このレポートを削除します。元に戻せません。よろしいですか？")) return;
        try {
          await fetch(`${API_BASE}/reports/${state.activeReportId}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${session.token}` },
          });
          showToast("レポートを削除しました");
          goBackFromReportDetail();
        } catch (err) {
          showToast("削除に失敗しました");

    const form = document.getElementById("comment-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = new FormData(form).get("message");
      const errEl = document.getElementById("comment-error");
      if (!message || !message.trim()) {
        errEl.textContent = "メッセージを入力してください";
        errEl.style.display = "block";
        return;
      }
      errEl.style.display = "none";
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true; submitBtn.textContent = "送信中…";
      try {
        await apiPost(`/reports/${state.activeReportId}/comments`, { message });
        renderReportDetail();
      } catch (err) {
        submitBtn.disabled = false; submitBtn.textContent = "送信する";
        errEl.textContent = err.message || "送信に失敗しました";
        errEl.style.display = "block";
      }
    });
  }

  function goBackFromReportDetail() {
    const origin = state.reportOrigin;
    state.activeReportId = null;
    state.reportOrigin = null;
    if (origin && origin.tab === "programs" && origin.programId) {
      state.activeProgramId = origin.programId;
      state.tab = "programs";
    } else {
      state.tab = "myreports";
    }
    render();
  }

  // ---------- ログイン ----------
  function renderLogin() {
    document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === "login"));
    main.innerHTML = `
      <section class="panel narrow">
        <h2>ログイン</h2>
        <p class="muted">メールアドレスと、認証アプリに表示されている6桁のコードを入力してください。</p>
        <form class="form" id="login-form">
          <label class="field">
            <span class="field-label">アカウント種別</span>
            <div class="login-type-toggle">
              <button type="button" class="btn ghost sm active-type" data-type="hunter">ハンター</button>
              <button type="button" class="btn ghost sm" data-type="program">企業</button>
            </div>
            <input type="hidden" name="userType" value="hunter">
          </label>
          <label class="field"><span class="field-label">メールアドレス *</span><input type="email" name="email" placeholder="you@example.com"></label>
          <label class="field">
            <span class="field-label">6桁のコード（またはバックアップコード） *</span>
            <input class="code-input" name="code" inputmode="numeric" maxlength="11" placeholder="000000">
          </label>
          <p class="form-error" id="login-error" style="display:none"></p>
          <button class="btn primary" type="submit">ログイン</button>
        </form>
      </section>
    `;

    const form = document.getElementById("login-form");
    form.querySelectorAll(".login-type-toggle button").forEach((btn) => {
      btn.addEventListener("click", () => {
        form.querySelectorAll(".login-type-toggle button").forEach((b) => b.classList.remove("active-type"));
        btn.classList.add("active-type");
        form.querySelector("[name=userType]").value = btn.dataset.type;
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      const errEl = document.getElementById("login-error");
      if (!data.email || !data.code) {
        errEl.textContent = "メールアドレスとコードを入力してください";
        errEl.style.display = "block";
        return;
      }
      errEl.style.display = "none";
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true; submitBtn.textContent = "ログイン中…";
      try {
        const result = await apiLogin(data.userType, data.email, data.code);
        setSession({ token: result.token, userType: result.userType, id: result.id, name: result.name });
        if (result.usedBackupCode) {
          showToast(`バックアップコードでログインしました。残り${result.backupCodesRemaining}個です`);
        } else {
          showToast("ログインしました");
        }
        setTab("home");
      } catch (err) {
        submitBtn.disabled = false; submitBtn.textContent = "ログイン";
        errEl.textContent = err.message || "ログインに失敗しました";
        errEl.style.display = "block";
      }
    });
  }

  // ---------- init ----------
  (async function init() {
    try {
      await refreshPrograms();
      await refreshHunters();
      await refreshReportCount();
    } catch (e) {
      showToast("APIへの接続に失敗しました");
    }

    // 保存されているセッションが今も有効か確認する
    const session = getSession();
    if (session) {
      try {
        await apiGetAuthed("/auth/me");
      } catch (e) {
        clearSession();
      }
    }
    renderAuthStatus();
    setTab("home");
  })();
})();
</script>
